<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DPI Whiteboard Tremola App</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>DPI Whiteboard</h1>
          <p>Tremola mini-app prototype</p>
        </div>
        <div class="sync-pill" id="sync-status">local event log</div>
      </header>

      <section class="workspace">
        <section class="board-wrap" aria-label="Shared board">
          <div id="mode-hint" class="mode-hint">Select or drag notes</div>
          <svg id="board" class="board" viewBox="0 0 1000 680" role="img" aria-label="Object based collaboration board"></svg>
        </section>

        <aside class="side-panel">
          <h2>Activity</h2>
          <ol id="activity-log" class="activity-log"></ol>
        </aside>
      </section>

      <nav class="toolbar" aria-label="Board tools">
        <button id="tool-select" class="tool-button is-active" type="button">Select</button>
        <button id="tool-note" class="tool-button primary" type="button">Note</button>
        <button id="tool-draw" class="tool-button" type="button">Draw</button>
        <button id="edit-selected" class="tool-button" type="button" disabled>Edit</button>
        <button id="delete-selected" class="tool-button danger" type="button" disabled>Delete</button>
      </nav>

      <section id="note-sheet" class="note-sheet" aria-hidden="true">
        <form id="note-form" class="note-form">
          <label for="note-text">Note</label>
          <textarea id="note-text" rows="3" maxlength="180" placeholder="Write a note..."></textarea>
          <div class="note-actions">
            <button id="cancel-note" class="sheet-button" type="button">Cancel</button>
            <button id="save-note" class="sheet-button primary" type="submit">Add note</button>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
